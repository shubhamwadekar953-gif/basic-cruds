<div class="container-fluid ">
    <h1 class = "bg-danger text-white text-center m-5">REVISION CRUD</h1>
    <div class="row">
        <div class="col-md-4">
            <div class="form">
                <div class="card">
                    <div class = "card-body">
                    <h2 class = "bg-danger text-center text-white">REVISION CRUD</h2>

                    <div class="form-group mb-3">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" #name>
                    </div>

                    <div class="form-group mb-3">
                        <label for="age">Age</label>
                        <input type=number class="form-control" #age>
                    </div>

                    <div class="form-group mb-5">
                        <label for="course">Course</label>
                        <input type="text" class="form-control" #course>
                    </div>

                    <button (click)="onAdd()" *ngIf = "!isUpdating" class="btn btn-primary text-white text-center">Submit</button>
                    <button (click)="onUpdate()" *ngIf = "isUpdating" class="btn btn-success text-white text-center">Update</button>
                    </div>
                </div>
            </div>
        </div>

     <div class = "col-md-8">
        <div class="card">
            <h2 class = "bg-danger text-center text-white">REVISION LISTS</h2>
            <div class="table">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Course</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>

                    </thead>
                    <tbody>
                        <tr *ngFor="let revision of revisionArr; let i = index">
                            <td>{{revision.name}}</td>
                            <td>{{revision.age}}</td>
                            <td>{{revision.course}}</td>
                            <td><button (click)= "onEdit(revision)" class="btn btn-success">Edit</button></td>
                            <td><button (click)="onDelete(i)" class="btn btn-danger">Delete</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
        </div>
    </div>
</div>

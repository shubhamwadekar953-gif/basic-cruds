<div class = "container-fluid">
    <h1 class = "bg-warning text-white text-center m-5">STUDENT CRUD REVISION</h1>
    <div class = "row">
        <div class = "col-md-4">
            <div class = "form">
                <div class = "card">
                    <h2 class = "bg-warning text-white text-center">STUDENT CARD</h2>
                    <div class = "card-body">


                        <div class = "form-group mb-3">
                            <label for = "fName">First Name :</label>
                            <input type = "text" class = "form-control" #fName>
                        </div>

                        <div class = "form-group mb-3">
                            <label for = "lName">Last Name :</label>
                            <input type = "text" class = "form-control" #lName>
                        </div>

                        <div class = "form-group mb-3">
                            <label for = "email">Email :</label>
                            <input type = "text" class = "form-control" #email>
                        </div>

                        <div class = "form-group mb-3">
                            <label for = "age">Age :</label>
                            <input type = number class = "form-control" #age>
                        </div>

                        <div class = "form-group mb-5">
                            <label for = "fName">Contact :</label>
                            <input type = "text" class = "form-control" #contact>
                        </div>

                        <button (click) = "onAddstudent()"  *ngIf="!isUpdating" class = "btn btn-primary">Add Student</button>
                        <button (click) = "onUpdate()" *ngIf="isUpdating" class = "btn btn-success">Update Student</button>


                    </div>
                </div>
            </div>
        </div>

        <div class = "col-md-8">
            <div class = "card">
                <h2 class = "bg-warning text-white text-center">STUDENT LIST</h2>
                <table class = "table table-bodered">
                    <thead>
                        <tr>
                            <th>FIRST NAME</th>
                            <th>LAST NAME</th>
                            <th>EMAIL</th>
                            <th>AGE</th>
                            <th>CONTACT NO</th>
                            <th>EDIT</th>
                            <th>UPDATE</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor = "let student of studenttwoArr; let i = index" >
                            <td>{{student.fName}}</td>
                            <td>{{student.lName}}</td>
                            <td>{{student.email}}</td>
                            <td>{{student.age}}</td>
                            <td>{{student.contact}}</td>
                            <td><button (click) = "onEdit(student)" class = "btn btn-success">Edit</button></td>
                            <td><button (click) = "onDelete(i)" class = "btn btn-danger">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid">
    <h1 class="bg-success text-white text-center m-5">COMMENTS CRUD</h1>
    <div class="row">
        <div class="col-md-4">
            <div class="form">
                <div class="card">
                    <h2 class="bg-success text-white text-center">COMMENTS CARD</h2>
                    <div class="card-body">

                        <div class="form-group mb-3">
                            <label for="postId">Comment ID</label>
                            <input type=number class="form-control" #postId>
                        </div>

                        <div class="form-group mb-3">
                            <label for="name">Comment Name</label>
                            <input type="text" class="form-control" #name>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email">Email</label>
                            <input type="text" class="form-control" #email>
                        </div>

                        <div class="form-group mb-5">
                            <label for="body">Body :</label>
                            <input type="text" class="form-control" #body>
                        </div>

                        <button (click) = "onAddcomment()" *ngIf="!isUpdating" class="btn btn-primary text-white">Add Student</button>
                        <button (click) = "onUpdate()" *ngIf="isUpdating" class="btn btn-success text-white">Update Student</button>


                    </div>
                </div>
            </div>
        </div>


        <div class="col-md-8">
            <div class = "card">
                <h2 class = "bg-success text-white text-center">COMMENTS LIST</h2>
                <div class = "card-body">
                    <table class = "table table-bordered">
                        <thead>
                            <th>POST ID</th>
                            <th>POST NAME</th>
                            <th>EMAIL</th>
                            <th>BODY</th>
                            <th>EDIT</th>
                            <th>DELETE</th>
                        </thead>
                        <tbody *ngFor = "let comment of commentsArr; let i = index">
                            <td>{{comment.postId}}</td>
                            <td>{{comment.name}}</td>
                            <td>{{comment.email}}</td>
                            <td>{{comment.body}}</td>
                            <td><button (click) = "onEdit(comment)" class = "btn btn-success">Edit</button></td>
                            <td><button (click) = "onDelete(i)" class = "btn btn-danger">Delete</button></td>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>



    </div>
</div>

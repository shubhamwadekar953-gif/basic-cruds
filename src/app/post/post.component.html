<div class="container-fluid">
    <h1 class="bg-primary text-white text-center m-5">POST CRUD</h1>
    <div class="row">
        <div class="col-md-4">
            <div class="form">
                <div class="card">
                    <h2 class="bg-primary text-center text-white">POST CARD</h2>
                    <div class="card-body">


                        <div class="form-group mb-3">
                            <label for="userId">User ID :</label>
                            <input type=number class="form-control" #userId>
                        </div>


                        <div class="form-group mb-3">
                            <label for="title">title :</label>
                            <input type="text" class="form-control" #title>
                        </div>

                        <div class="form-group mb-5">
                            <label for="body">body :</label>
                            <input type="text" class="form-control" #body>
                        </div>

                        <button (click)="onAddPost()" *ngIf="! isUpdating" class="btn btn-primary text-white">Add
                            Post</button>
                        <button (click)="onUpdate()" *ngIf="isUpdating"
                            class="btn btn-success text-white text-center">Updat Post</button>


                    </div>
                </div>
            </div>
        </div>



        <div class=col-md-8>
            <div class="card">
                <h2 class="bg-primary text-white text-center">POST LIST</h2>
                <table class="table table-bordered">
                    <thead>
                        <th>USER ID</th>
                        <th>TITLE</th>
                        <th>BODY</th>
                        <th>EDIT</th>
                        <th>DELETE</th>
                    </thead>
                    <tbody *ngFor="let post of postArr; let i = index">
                        <td>{{post.userId}}</td>
                        <td>{{post.title}}</td>
                        <td>{{post.body}}</td>
                        <td><button (click)="onEdit(post)" class="btn btn-success">Edit</button></td>
                        <td><button (click)="onDelete(i)" class="btn btn-danger">Delete</button></td>
                    </tbody>
                </table>
            </div>
        </div>


    </div>
</div>
